name: Gerar Abas Mensais no Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'dados.xlsx'

jobs:
  processar-excel:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4  # Atualizado para v4
    
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl
        
    - name: Executar script
      run: |
        python criar_abas.py
        
    - name: Fazer upload do arquivo processado
      uses: actions/upload-artifact@v4  # Versão atualizada para v4
      with:
        name: excel-processado
        path: dados_com_abas_mensais.xlsx
